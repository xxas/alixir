[package]
  name    = "alixir"
  version = "0.1.0"
  edition = "2021"

[dependencies]
  bitflags    = "2.6.0"
  thiserror   = "2.0.1"
  derive_more = { version = "1.0.0", features = ["full", "constructor"] }
  petgraph    = "0.6.5"
  goblin      = "0.9.2"
  capstone    = "0.12.0"
  glob        = "0.3.1"
  rangemap    = "1.5.1"

[lib]
  name = "alixir"
  path = "lib/lib.rs"
